<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Convertisseur d'ID en Coordonnées</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #1c1c1e;
            color: #ffffff;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 { margin: 0; text-align: center; }
        p { text-align: center; color: #ebebf5; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 60vh;
        }
        textarea {
            width: 100%;
            height: 100%;
            background: #000000;
            color: #32d74b;
            border: 1px solid #38383a;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        textarea#input-ids { color: #ffffff; }
        button {
            padding: 15px;
            font-size: 1.2rem;
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #007aff; }
        button:disabled { background: #38383a; color: #ebebf5; cursor: not-allowed; }
        #status {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff9f0a;
        }
    </style>
</head>
<body>
    <h1>Convertisseur Massif Pano ID -> GPS</h1>
    <p>Collez vos 650 identifiants dans la case de gauche (un par ligne), puis cliquez sur Convertir.<br>Le script demandera les redirections depuis le Service Worker pour eviter les erreurs CORS.</p>
    
    <div class="grid">
        <textarea id="input-ids" placeholder="Collez les ID ici..."></textarea>
        <textarea id="output-data" readonly placeholder="Les resultats apparaitront ici..."></textarea>
    </div>

    <button id="btn-convert">Demarrer la conversion</button>
    <div id="status">En attente...</div>

    <script>
        document.getElementById('btn-convert').addEventListener('click', async () => {
            const inputArea = document.getElementById('input-ids');
            const outputArea = document.getElementById('output-data');
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btn-convert');

            const ids = inputArea.value.split('\n').map(id => id.trim()).filter(id => id.length > 0);
            
            if (ids.length === 0) {
                statusDiv.textContent = 'Erreur : Aucune donnee en entree.';
                return;
            }

            btn.disabled = true;
            let resultString = '';
            let successCount = 0;
            let errorCount = 0;

            for (let i = 0; i < ids.length; i++) {
                const panoId = ids[i];
                statusDiv.textContent = `Conversion en cours : ${i + 1} / ${ids.length} ...`;
                
                try {
                    const response = await new Promise(resolve => {
                        chrome.runtime.sendMessage({ action: 'fetchPanoData', panoId: panoId }, resolve);
                    });

                    if (response && response.success && response.finalUrl) {
                        const match = response.finalUrl.match(/@([-0-9.]+),([-0-9.]+)/);
                        
                        if (match && match[1] && match[2]) {
                            resultString += `            { pano: 'img/puydufou/${panoId}.jpg', lat: ${match[1]}, lng: ${match[2]} },\n`;
                            successCount++;
                        } else {
                            resultString += `            // ECHEC LECTURE COORDS : ${panoId}\n`;
                            errorCount++;
                        }
                    } else {
                        resultString += `            // ECHEC RESEAU (CORS ou Timeout) : ${panoId}\n`;
                        errorCount++;
                    }
                } catch (err) {
                    resultString += `            // ERREUR SYSTEME : ${panoId}\n`;
                    errorCount++;
                }

                outputArea.value = resultString;
                outputArea.scrollTop = outputArea.scrollHeight;

                await new Promise(resolve => setTimeout(resolve, 150)); 
            }

            statusDiv.textContent = `Termine ! ${successCount} reussis, ${errorCount} erreurs.`;
            statusDiv.style.color = '#34c759';
            btn.disabled = false;
        });
    </script>
</body>
</html>
