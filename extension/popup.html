<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h3>Auto Pano Grabber (Live)</h3>
    <div class="toggle-container">
        <label for="scan-toggle" class="toggle-label">Scan Automatique</label>
        <div class="switch">
            <input type="checkbox" id="scan-toggle" name="scan_toggle">
            <span class="slider"></span>
        </div>
    </div>
    <div class="stats">Points enregistrés : <strong id="count">0</strong></div>
    <textarea id="pano-list" readonly></textarea>
    <div class="btn-group">
        <button id="copy-btn" type="button">Copier le JS</button>
        <button id="download-zip-btn" type="button" style="background: #ff9f0a;">Télécharger ZIP</button>
        <button id="clear-btn" type="button">Vider</button>
    </div>
    <div id="notification"></div>
    <script src="jszip.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
