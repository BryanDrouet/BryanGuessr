<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="BryanGuessr : Testez vos connaissances géographiques et repérez-vous dans vos parcs d'attractions préférés.">
    <title>BryanGuessr</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='lucide lucide-map-pin'%3E%3Cpath d='M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z'/%3E%3Ccircle cx='12' cy='10' r='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script>
        const cacheBuster = new Date().getTime();
        const cssFiles = ['css/base.css', 'css/ui.css', 'css/game.css'];
        cssFiles.forEach(file => {
            const cssLink = document.createElement('link');
            cssLink.rel = 'stylesheet';
            cssLink.href = file + '?v=' + cacheBuster;
            document.head.appendChild(cssLink);
        });
    </script>
</head>
<body>
    <div id="app" aria-live="polite"></div>

    <div id="rgpd-banner" role="dialog" aria-labelledby="rgpd-title" aria-describedby="rgpd-desc" class="hidden">
        <h2 id="rgpd-title">Gestion des données</h2>
        <p id="rgpd-desc">BryanGuessr utilise le stockage local pour sauvegarder vos scores conformément au RGPD.</p>
        <button id="btn-accept-rgpd" aria-label="Accepter et fermer">Compris</button>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const jsFiles = ['js/data.js', 'js/engine.js', 'js/app.js'];
        jsFiles.forEach(file => {
            const jsScript = document.createElement('script');
            jsScript.src = file + '?v=' + cacheBuster;
            jsScript.async = false;
            document.body.appendChild(jsScript);
        });
    </script>
</body>
</html>
